
# -----------------------------
# Restores the project, then builds and runs all tests in the solution
# Then it builds a docker file to make sure it is functional
# -----------------------------

name: Build and Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore
    
      - name: Build
        run: dotnet build --configuration Release --no-restore
    
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal
    
  build-docker: 
      name: Build Docker Image
      runs-on: ubuntu-latest
      needs: build-and-test
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Build Docker Image
          run: |
            docker build -t sebportal:${{ github.sha }} -f backend/SebPortal/Dockerfile backend/SebPortal    