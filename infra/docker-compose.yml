# =====================================================================
# PLATTFORMSFIL: ändra denna fil med försiktighet. Se DRIFT.md.
# Er deploy-miljö (stage/prod) kräver att:
#   1. filen ligger kvar som infra/docker-compose.yml
#   2. webbtjänsten heter "app"
#   3. "expose" används här, aldrig "ports"
#      (lokala portar: se docker-compose.override.yml)
#   4. appens lyssningsport matchar expose-värdet
# En automatisk kontroll (.github/workflows/infra-guard.yml) ger rött X
# på push som bryter mot regel 1-3.
# =====================================================================
version: "3.9"
name: seb

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  app:
    build:
      context: ..
      dockerfile: backend/SebPortal/Dockerfile
    expose:
      - "8081"
    volumes:
      - ./seed.sql:/seed/seed.sql:ro
      - auditlogs:/app/audit
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8081"
      ConnectionStrings__DefaultConnection: ${DEFAULT_CONNECTION}
      Jwt__Secret: ${JWT_SECRET}
      Audit__LogPath: ${AUDIT_LOG_PATH}
      Audit__SigningKey: ${AUDIT_SIGNING_KEY}
      Seed__Path: "/seed/seed.sql" 
      
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  auditlogs:
