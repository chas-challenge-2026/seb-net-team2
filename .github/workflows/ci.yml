
# -----------------------------
# Restores the project, then builds and runs all tests in the solution
# Then it builds a docker file to make sure it is functional
# -----------------------------

name: Build and Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
          make \
          libc6-dev \
          gcc \
          libssl-dev
      
      - name: Build native code
        run: make -C native

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore
    
      - name: Build
        run: dotnet build --configuration Release --no-restore
    
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Test with Coverage
        run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"

      - name: Upload Coverage Results
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: '**/TestResults/**/*.cobertura.xml'

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t sebportal:${{ github.sha }} -f backend/SebPortal/Dockerfile .

  frontend:
    name: Frontend build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --ci

      - name: Build frontend
        run: npm run build
